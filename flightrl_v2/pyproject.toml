[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flightrl_v2"
version = "2.0.0"
description = "Modern Reinforcement Learning for Flightmare Quadrotor Simulator"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "gymnasium>=0.28.0",
    "stable-baselines3[extra]>=2.0.0",
    "sb3-contrib>=2.0.0",
    "torch>=2.0.0",
    "numpy>=1.21.0,<2.0.0",
    "matplotlib>=3.5.0",
    "tensorboard>=2.12.0",
    "ruamel.yaml>=0.17.0",
    "pandas>=1.5.0",
    "pillow>=9.0.0",
    "plotly>=5.0.0",
    "tqdm>=4.65.0",
    "imageio>=2.25.0",
    "imageio-ffmpeg>=0.4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black>=23.0.0", "isort>=5.12.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flightrl_v2*"]
